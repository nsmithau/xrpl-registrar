name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # Version comes from the packageManager field in package.json.

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  # The same suites again, against a real Postgres server instead of
  # in-process PGlite — plus the suites that only exist there (concurrency,
  # driver type mapping, cross-process migration locking), which skip in the
  # job above. Storage is meant to be engine-agnostic; this is what keeps that
  # claim honest rather than aspirational.
  postgres:
    name: test against networked Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xrpl_registrar_test
        ports:
          # Matches the local docker-compose.test.yml, so TEST_DATABASE_URL is
          # the same string in CI and on a developer's machine.
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xrpl_registrar_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:pg
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/xrpl_registrar_test
